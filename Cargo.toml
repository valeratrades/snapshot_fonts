[package]
name = "snapshot_fonts"
version = "1.2.0"
edition = "2024"
description = "High-resolution terminal bar charts using custom PUA fonts (251 levels per half-character)"
license = "BlueOak-1.0.0"
repository = "https://github.com/valeratrades/snapshot_fonts"
keywords = ["terminal", "charts", "visualization", "unicode", "font"]
categories = ["command-line-utilities", "visualization"]

[package.metadata.docs.rs]
cargo-args = ["-Zunstable-options", "-Zrustdoc-scrape-examples"]

[dependencies]
bon = "3.9.0"
clap = { version = "^4", features = ["derive"] }
color-eyre = "^0.6.3"
derive-new = "0.7.0"
v_utils = "^2"

[dev-dependencies]
insta = "^1"
rand = "^0.9"
tempfile = "^3"
v_utils = { version = "^2", features = ["distributions"] }

[lints.clippy]
# Stable
float_cmp = "allow" # is bad for `==` direct comparisons, but `<` and `>` should be allowed
len_zero = "allow" # `.empty()` is O(1) but on &str only
undocumented_unsafe_blocks = "warn"
tabs_in_doc_comments = "allow"

# Questionable
# const fns, so actually more performant
get_first = "allow"
get_last_with_len = "allow"
